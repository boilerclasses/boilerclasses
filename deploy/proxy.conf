# nginx on the VM's port 80, in front of the app container.
# cloudflared sends all traffic to localhost:80, so a deploy starts the new
# container on another port, waits for it, then points upstream.inc at it
# and reloads nginx. Requests in flight finish on the old container.
upstream boilerclasses {
  # one "server 127.0.0.1:<port>;" line, written by deploy/deploy.sh
  include /etc/nginx/conf.d/upstream.inc;
  keepalive 32;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;

  # cloudflared is the only client; its logs already show every failed request
  access_log off;
  client_max_body_size 10m;

  location / {
    proxy_pass http://boilerclasses;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }
}
